# PescaBA — infraestructura local de desarrollo
# Uso: docker compose up -d
# Servicios: PostgreSQL+PostGIS, Redis, MinIO (S3), Meilisearch (opcional, perfil "search")

name: pesca-ba

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    container_name: pesca-ba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pesca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pesca_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pesca_ba}
    ports:
      - '5432:5432'
    volumes:
      - pesca-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pesca} -d ${POSTGRES_DB:-pesca_ba}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pesca-ba-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - pesca-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: pesca-ba-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    volumes:
      - pesca-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: búsqueda dedicada. Para usarla: docker compose --profile search up -d
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: pesca-ba-meilisearch
    profiles: ['search']
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-pesca_dev_master_key}
    ports:
      - '7700:7700'
    volumes:
      - pesca-meili-data:/meili_data

volumes:
  pesca-db-data:
  pesca-redis-data:
  pesca-minio-data:
  pesca-meili-data:
